# Runs the project's two automated checks (AGENTS.md) on every push and pull request.
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Cloud runners have no screen, sound card or gamepad.
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: System libraries (PortAudio for audio output, Qt runtime)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: Build native audio module
        run: python setup.py build_ext --inplace
      - name: Frontend dependencies (the Python source renderer also runs Node scripts from desktop/)
        working-directory: desktop
        run: npm ci
      - name: Python tests
        # Failing tests and their errors also appear as annotations on the run page.
        run: |
          set +e
          python -m unittest discover -s tests 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          grep -E '^(ERROR|FAIL):|^[A-Za-z.]*(Error|Exception)\b' test.log | sort | uniq | head -40 | sed 's/^/::error::/'
          exit $code
      - name: Frontend build
        working-directory: desktop
        run: npm run build
