# Sound check: the MoSQITo guardrail (tools/sound_map/score.py) and the full-drive check (drive.py), both on the labelled sounds.
# Run by hand: Actions > Sound check > Run workflow. Each prints an "... check OK" line and fails the job if it does not.
name: Sound check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dependencies
        run: |
          pip install -r tools/sound_map/requirements.txt
          cd desktop && npm ci
      - name: Guardrail check (about 4 min)
        run: python tools/sound_map/score.py | tee guardrail.txt && grep -q "guardrail check OK" guardrail.txt
      - name: Full-drive check
        run: python tools/sound_map/drive.py labelled | tee drive.txt && grep -q "full-drive check OK" drive.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; tail -n 40 guardrail.txt drive.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
