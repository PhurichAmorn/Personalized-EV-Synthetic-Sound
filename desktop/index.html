<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark first paint, and load the web fonts without blocking the first paint (a slow network used to show a white window). -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;600&family=Rajdhani:wght@500;600&display=swap" media="print" onload="this.media='all'" />
    <title>EV Sound Lab</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
